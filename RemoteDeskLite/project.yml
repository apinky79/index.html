name: RemoteDeskLite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  RemoteDeskLite:
    type: application
    platform: iOS
    sources:
      - path: RemoteDeskLite
        excludes:
          - Assets.xcassets
          - Info.plist
    resources:
      - path: RemoteDeskLite/Assets.xcassets
    info:
      path: RemoteDeskLite/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RemoteDeskLite
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: RemoteDeskLite scans and connects to remote hosts on your local network.
  RemoteDeskLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemoteDeskLiteTests
    dependencies:
      - target: RemoteDeskLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RemoteDeskLiteTests
